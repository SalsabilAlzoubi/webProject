<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="../css/gridStyle.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h2>HEADER</h2>
        </header>

        <nav class="nav-bar">
            <div>HOME</div>
            <div>ABOUT</div>
            <div>SERVICES</div>
            <div>PORTFOLIO</div>
            <div>BLOG</div>
            <div>CONTACT</div>
        </nav>

        <section class="hero">
            <h2>Hero Section</h2>
            <p>(Large Banner)</p>
        </section>

        <section class="features">
            <div class="feature-item">Feature 1</div>
            <div class="feature-item">Feature 2</div>
            <div class="feature-item">Feature 3</div>
            <div class="feature-item">Feature 4</div>
        </section>
        
        <div class="content">
            <main class="main-content">
                <h2>Main Content</h2>
                <p>(Article / Posts)</p>
                <div class="cards-grid">
                    <div class="cards">
                        <div class="img"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                    <div class="cards">
                        <div class="img"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                    <div class="cards">
                        <div class="img"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                </div>
            </main>

            <aside class="sidebar">
                <h3>SIDEBAR</h3>
                <div class="widget">WIDGET 1</div>
                <div class="widget">WIDGET 2</div>
                <div class="widget">WIDGET 3</div>
            </aside>
        </div> 

        <footer class="footer-top">
            <div class="footer-col">
                <h4>ABOUT US</h4>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            <div class="footer-col">
                <h4>QUICK LINKS</h4>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            <div class="footer-col">
                <h4>SERVICES</h4>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            <div class="footer-col">
                <h4>CONTACT</h4>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            <div class="footer-col">
                <h4>FOLLOW US</h4>
                <div class="icons">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </footer>

        <footer class="footer-bottom">
            <p>© 2024 Your Website. All rights reserved.</p>
        </footer>
        
    </div>
</body>
</html>
